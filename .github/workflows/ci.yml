name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NARGO_VERSION: 1.0.0-rc.4
  BB_VERSION: 5.0.0
  CARGO_TERM_COLOR: always

jobs:
  test-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Cache Noir toolchain
        id: noir-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nargo
            ~/.bb
          key: noir-${{ runner.os }}-nargo-${{ env.NARGO_VERSION }}-bb-${{ env.BB_VERSION }}

      - name: Install Nargo and bb
        if: steps.noir-cache.outputs.cache-hit != 'true'
        run: |
          curl -L https://raw.githubusercontent.com/noir-lang/noirup/refs/heads/main/install | bash
          "$HOME/.nargo/bin/noirup" -v "$NARGO_VERSION"
          curl -L https://raw.githubusercontent.com/AztecProtocol/aztec-packages/refs/heads/next/barretenberg/bbup/install | bash
          "$HOME/.bb/bbup" -v "$BB_VERSION"

      - name: Add toolchain to PATH
        run: |
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.bb" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          cargo --version
          nargo --version
          bb --version

      - name: test-all
        run: cargo run -- test-all
